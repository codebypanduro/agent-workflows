# Addresses the review feedback on a pull request. This is the end of the
# chain: it never re-requests review, which is what stops the loop.
#
# Generated by `npx @codebypanduro/agent-workflows init`. The logic lives in
# codebypanduro/agent-workflows; this file only says when to run it. Settings are in
# agent-workflows.config.json — edit that, not this.

name: Agent Implement PR

on:
  pull_request_target:
    types: [labeled]

jobs:
  run:
    if: >-
      github.event.label.name == 'agent:todo'
      && github.event.pull_request.head.repo.full_name == github.repository
    # Granted here, not in the called workflow: a reusable workflow can only
    # narrow what the caller gives it. Without this the run dies at startup.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/implement-pr.yml
    with:
      package-spec: "file:."
    secrets: inherit
