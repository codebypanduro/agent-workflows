# Merges the base branch in. Never rebases — that would detach review comments.
#
# Generated by `npx @codebypanduro/agent-workflows init`. The logic lives in
# codebypanduro/agent-workflows; this file only says when to run it. Settings are in
# agent-workflows.config.json — edit that, not this.

name: Agent Merge Main

on:
  pull_request_target:
    types: [labeled]

jobs:
  run:
    if: >-
      github.event.label.name == 'agent:merge-main'
      && github.event.pull_request.head.repo.full_name == github.repository
    # Granted here, not in the called workflow: a reusable workflow can only
    # narrow what the caller gives it. Without this the run dies at startup.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/merge-main.yml
    with:
      package-spec: "file:."
    secrets: inherit
