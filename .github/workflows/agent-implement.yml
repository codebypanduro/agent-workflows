# Implements an issue from scratch and opens a draft pull request.
#
# Generated by `npx @codebypanduro/agent-workflows init`. The logic lives in
# codebypanduro/agent-workflows; this file only says when to run it. Settings are in
# agent-workflows.config.json — edit that, not this.

name: Agent Implement

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to work
        required: true
        type: string

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:todo'
    # Granted here, not in the called workflow: a reusable workflow can only
    # narrow what the caller gives it. Without this the run dies at startup.
    permissions:
      issues: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/implement.yml
    # A reusable workflow cannot see the caller's inputs, so a manual run
    # has to hand the issue number over explicitly.
    with:
      issue_number: ${{ inputs.issue_number || '' }}
      package-spec: "file:."
    secrets: inherit
