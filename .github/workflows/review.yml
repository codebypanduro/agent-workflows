name: Review

# Reusable. Callers trigger on `pull_request_target: labeled` and point here;
# run `npx @codebypanduro/agent-workflows init` to generate one.
#
# pull_request_target rather than pull_request: the standard trigger depends on
# a generated merge commit, which GitHub fails to produce when the pull request
# is out of date or conflicting. Safe because the trigger is `labeled` and only
# collaborators can apply labels — but note this checks out head code with
# secrets in scope, so a public repository needs to think harder about it.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      timeout-minutes:
        type: number
        default: 45
      package-version:
        type: string
        default: latest
      package-spec:
        description: Full npm spec, overriding package-version. Accepts a git spec.
        type: string
        default: ""

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    permissions:
      # read, not write: enough to clone the code under review, not enough to
      # change it. That asymmetry is what makes "comment-only" a fact the
      # platform enforces rather than a promise the prompt makes.
      #
      # Omitting `contents` entirely does not work — on a private repository
      # the checkout then fails with "Repository not found", which reads like a
      # missing repo rather than a missing scope.
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      CLI: npx -y ${{ inputs.package-spec != '' && inputs.package-spec || format('@codebypanduro/agent-workflows@{0}', inputs.package-version) }}

    steps:
      - name: Claim the pull request
        id: claim
        run: |
          gh pr edit "$PR_NUMBER" -R "$REPO" \
            --remove-label "agent:review" \
            --remove-label "human:blocked" \
            --remove-label "human:review" \
            --add-label "agent:in-progress"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # Config comes from the base branch, never the head. A branch older than
      # the config file has none at all, and a branch is untrusted input — a
      # pull request could otherwise set `verify: []` and have the agent call
      # itself green, on a run holding the repository's secrets.
      - name: Take the config from the base branch
        run: |
          set -euo pipefail
          # Not --depth=1: that leaves origin/$BASE_REF shallow, and a later
          # `git merge origin/$BASE_REF` then finds no common ancestor and
          # fails instantly. The checkout above is already unshallow.
          git fetch origin "$BASE_REF"
          if ! git show "origin/$BASE_REF:agent-workflows.config.json" > "$RUNNER_TEMP/agent-workflows.config.json"; then
            echo "::error::agent-workflows.config.json is not on $BASE_REF. Run 'npx @codebypanduro/agent-workflows init' and merge it before labelling pull requests."
            exit 1
          fi
          # Exported here rather than in the job's env: block, because the
          # `runner` context does not exist at job level — only in steps.
          echo "AGENT_WORKFLOWS_CONFIG=$RUNNER_TEMP/agent-workflows.config.json" >> "$GITHUB_ENV"

      # No project setup and no verification here: the reviewer changes nothing,
      # so both would only duplicate what the project's own CI runs.

      - name: Check the credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate it with 'claude setup-token' and add it as a repository secret."
            exit 1
          fi

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the reviewer
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: $CLI review

      # Comments whose path/line are not in the diff were already folded into
      # the review body, so this payload cannot 422 on a hallucinated line.
      - name: Post the review
        if: steps.agent.outcome == 'success'
        run: gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$RUNNER_TEMP/review_payload.json"

      # Out of draft either way: the review is posted, so there is something for
      # a human to read whether or not an agent gets another pass at it.
      - name: Mark the pull request ready
        if: steps.agent.outcome == 'success'
        run: gh pr ready "$PR_NUMBER" -R "$REPO" || true

      - name: Decide the terminal label
        id: transition
        if: always() && steps.claim.outcome == 'success'
        env:
          WORKFLOW: review
          OUTCOME: ${{ steps.agent.outputs.outcome || 'crashed' }}
          DETAIL: ${{ steps.agent.outputs.detail }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: $CLI transition

      - name: Apply the terminal label
        if: always() && steps.transition.outcome == 'success'
        env:
          REMOVE_LABEL: ${{ steps.transition.outputs.remove_label }}
          ADD_LABEL: ${{ steps.transition.outputs.add_label }}
          CHAIN_LABEL: ${{ steps.transition.outputs.chain_label }}
          COMMENT: ${{ steps.transition.outputs.comment }}
          AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" -R "$REPO" --remove-label "$REMOVE_LABEL"
          if [ -n "$ADD_LABEL" ]; then
            gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "$ADD_LABEL"
          fi
          if [ -n "$COMMENT" ]; then
            gh pr comment "$PR_NUMBER" -R "$REPO" --body "$COMMENT"
          fi
          # The PAT is what makes this write trigger implement-pr.
          if [ -n "$CHAIN_LABEL" ]; then
            GH_TOKEN="$AGENT_GH_TOKEN" gh pr edit "$PR_NUMBER" -R "$REPO" --add-label "$CHAIN_LABEL"
          fi

      - name: Fall back to a bare failure label
        if: always() && steps.claim.outcome == 'success' && steps.transition.outcome != 'success'
        run: |
          gh pr edit "$PR_NUMBER" -R "$REPO" \
            --remove-label "agent:in-progress" --add-label "human:blocked"
          gh pr comment "$PR_NUMBER" -R "$REPO" \
            --body "The review run failed before it could report an outcome — [run log]($RUN_URL)."
